name: Release A04e postmarketOS image

on:
  workflow_run:
    workflows:
      - A04e postmarketOS image build
    types:
      - completed
    branches:
      - linux/a04e-postmarketos-port
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful A04e image-build run ID (leave blank to use the latest successful run on this branch)"
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: a04e-release
  cancel-in-progress: false

jobs:
  package-and-release:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'linux/a04e-postmarketos-port') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - name: Select successful image-build run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RUN_ID: ${{ inputs.run_id }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${MANUAL_RUN_ID:-}" ]]; then
            RUN_ID="$MANUAL_RUN_ID"
          elif [[ -n "${EVENT_RUN_ID:-}" ]]; then
            RUN_ID="$EVENT_RUN_ID"
          else
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow a04e-postmarketos-image.yml \
              --branch linux/a04e-postmarketos-port \
              --status success --limit 1 --json databaseId \
              --jq '.[0].databaseId')"
          fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          [[ "$(jq -r '.conclusion' <<< "$RUN")" == "success" ]]
          [[ "$(jq -r '.head_branch' <<< "$RUN")" == "linux/a04e-postmarketos-port" ]]
          [[ "$(jq -r '.name' <<< "$RUN")" == "A04e postmarketOS image build" ]]
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.head_sha' <<< "$RUN")" >> "$GITHUB_OUTPUT"
          echo "run_number=$(jq -r '.run_number' <<< "$RUN")" >> "$GITHUB_OUTPUT"

      - name: Download the successful build artifact ZIP
        uses: actions/download-artifact@v4
        with:
          name: a04e-postmarketos-bringup-image
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release-files

      - name: Verify files and create release ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          cd release-files
          for file in boot.img super.img BUILD-INFO.txt SHA256SUMS.txt SUPER-METADATA.txt; do
            test -s "$file" || { echo "Missing or empty release file: $file" >&2; exit 1; }
          done
          sha256sum --check SHA256SUMS.txt
          cd ..
          ZIP="a04e-postmarketos-SM-A042F-run-${{ steps.source.outputs.run_id }}.zip"
          zip -9 -j "$ZIP" \
            release-files/boot.img \
            release-files/super.img \
            release-files/BUILD-INFO.txt \
            release-files/SHA256SUMS.txt \
            release-files/SUPER-METADATA.txt
          unzip -t "$ZIP"
          echo "zip_path=$ZIP" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP" >> "$GITHUB_OUTPUT"
          sha256sum "$ZIP" | tee "$ZIP.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: a04e-postmarketos-run-${{ steps.source.outputs.run_id }}
          name: "Samsung Galaxy A04e postmarketOS image — build ${{ steps.source.outputs.run_number }}"
          target_commitish: ${{ steps.source.outputs.head_sha }}
          prerelease: true
          generate_release_notes: true
          body: |
            Automated experimental A04e postmarketOS image package.

            Source workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ steps.source.outputs.run_id }}
            Source commit: ${{ steps.source.outputs.head_sha }}

            The ZIP contains boot.img, super.img, BUILD-INFO.txt, SHA256SUMS.txt, and SUPER-METADATA.txt.

            **Experimental / not confirmed bootable on-device.** CI structural validation is not handset runtime testing. Flashing is not validated; preserve complete stock backups. The super image replaces Android logical partitions. Read BUILD-INFO.txt before attempting any installation.
          files: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.zip_path }}.sha256
          fail_on_unmatched_files: true
