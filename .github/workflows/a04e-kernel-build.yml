name: A04e downstream kernel build

on:
  push:
    paths:
      - "linux/a04e/**"
      - ".github/workflows/a04e-kernel-build.yml"
      - ".github/workflows/a04e-postmarketos-image.yml"
  pull_request:
    paths:
      - "linux/a04e/**"
      - ".github/workflows/a04e-kernel-build.yml"
  workflow_dispatch:

concurrency:
  group: a04e-kernel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-a04e-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out MT-OS
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio flex libelf-dev \
            libncurses-dev libssl-dev python3 rsync xz-utils zlib1g-dev

      - name: Download pinned kernel source and toolchains
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="7c1b304f2df8df4c85abe6fe84b8238d7521bd58"
          KSU_COMMIT="56c55b692a00d90c0568a57ef5a8ed0daa23bb9a"
          CONNECTIVITY_COMMIT="3d48d43caa96b6f9be8a06199ee6eb2241d79153"
          mkdir -p "$RUNNER_TEMP/a04e-src" "$RUNNER_TEMP/a04e-toolchains"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/ravindu644/android_kernel_a042f/archive/$COMMIT.tar.gz" \
            -o "$RUNNER_TEMP/a04e-src/kernel.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/rifsxd/KernelSU-Next/archive/$KSU_COMMIT.tar.gz" \
            -o "$RUNNER_TEMP/a04e-src/kernelsu-next.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902.tar.gz" \
            -o "$RUNNER_TEMP/a04e-toolchains/clang-r383902.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz" \
            -o "$RUNNER_TEMP/a04e-toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/rsuntk-oss/mtk_connectivity_module/archive/$CONNECTIVITY_COMMIT.tar.gz" \
            -o "$RUNNER_TEMP/a04e-src/connectivity-4.19.tar.gz"
          (
            cd "$RUNNER_TEMP/a04e-toolchains"
            sha256sum *.tar.* | tee SHA256SUMS.txt
            sha512sum *.tar.* "$RUNNER_TEMP/a04e-src/kernel.tar.gz" "$RUNNER_TEMP/a04e-src/kernelsu-next.tar.gz" | tee SHA512SUMS.txt
          )
          tar -xf "$RUNNER_TEMP/a04e-src/kernel.tar.gz" -C "$RUNNER_TEMP/a04e-src"
          SRC="$RUNNER_TEMP/a04e-src/android_kernel_a042f-$COMMIT"
          CONNECTIVITY="$RUNNER_TEMP/a04e-src/mtk_connectivity_module"
          mkdir -p "$SRC/KernelSU-Next" "$CONNECTIVITY"
          tar -xzf "$RUNNER_TEMP/a04e-src/kernelsu-next.tar.gz" --strip-components=1 -C "$SRC/KernelSU-Next"
          tar -xzf "$RUNNER_TEMP/a04e-src/connectivity-4.19.tar.gz" --strip-components=1 -C "$CONNECTIVITY"
          test -f "$SRC/drivers/kernelsu/Kconfig"
          test -f "$CONNECTIVITY/common/common_main/platform/mt6765.c"
          test -f "$CONNECTIVITY/wlan/adaptor/Makefile"
          test -f "$CONNECTIVITY/wlan/core/gen4m/Makefile"
          test -f "$CONNECTIVITY/bt/mt66xx/wmt/Makefile"
          # This pinned vendor tree is the MT6765/MT6768 4.19 connectivity
          # implementation. Replace the old adapter-only subtree with its
          # matching in-tree WMT, Gen4M, GPS, FM and BTIF sources.
          DEST="$SRC/drivers/misc/mediatek/connectivity"
          # Keep the kernel's existing Kconfig symbols and add the two
          # build-in/logging options supplied by the pinned vendor source.
          cp "$DEST/Kconfig" "$RUNNER_TEMP/connectivity-Kconfig.base"
          rm -rf "$DEST/common" "$DEST/wlan" "$DEST/gps" "$DEST/fmradio" "$DEST/bt" "$DEST/power_throttling"
          cp -a "$CONNECTIVITY"/. "$DEST/"
          cp "$RUNNER_TEMP/connectivity-Kconfig.base" "$DEST/Kconfig"
          cat >> "$DEST/Kconfig" <<'KCONFIG'

          config DRV_BUILD_IN
              select MTK_COMBO_BT
              select MTK_COMBO_WIFI
              select MTK_COMBO_GPS
              select MTK_FMRADIO
              select MTK_GPS_SUPPORT
              bool "Build wireless related module as inline"
              default y
              help
                Build the MT6765 connectivity drivers into the kernel.

          config MTK_DISABLE_CONNECTIVITY_LOG
              bool "Enable or Disable logging for Mediatek connectivity drivers"
              default y
              help
                Reduce verbose connectivity logging on low-memory devices.
          KCONFIG
          test -s "$DEST/Makefile"
          grep -Fq 'config DRV_BUILD_IN' "$DEST/Kconfig"
          grep -Fq 'config MTK_DISABLE_CONNECTIVITY_LOG' "$DEST/Kconfig"
          tar -xf "$RUNNER_TEMP/a04e-toolchains/clang-r383902.tar.gz" -C "$RUNNER_TEMP/a04e-toolchains"
          tar -xf "$RUNNER_TEMP/a04e-toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz" -C "$RUNNER_TEMP/a04e-toolchains"
          test -f "$SRC/Makefile"
          CLANG="$(find "$RUNNER_TEMP/a04e-toolchains" -path '*/bin/clang' -print -quit)"
          CROSS_GCC="$(find "$RUNNER_TEMP/a04e-toolchains" -name 'aarch64-none-linux-gnu-gcc' -print -quit)"
          test -x "$CLANG"
          test -x "$CROSS_GCC"
          {
            echo "A04E_SRC=$SRC"
            echo "A04E_CONNECTIVITY_SRC=$CONNECTIVITY"
            echo "A04E_CONNECTIVITY_COMMIT=$CONNECTIVITY_COMMIT"
            echo "A04E_CLANG=$CLANG"
            echo "A04E_CROSS_COMPILE=${CROSS_GCC%gcc}"
          } >> "$GITHUB_ENV"

      - name: Configure the stock-matched kernel
        run: |
          set -euo pipefail
          export ARCH=arm64
          export ANDROID_MAJOR_VERSION=r
          make -C "$A04E_SRC" O=out CC="$A04E_CLANG" \
            CROSS_COMPILE="$A04E_CROSS_COMPILE" \
            CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS=-w \
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y a04e_defconfig
          "$A04E_SRC/scripts/kconfig/merge_config.sh" -m -O "$A04E_SRC/out" \
            "$A04E_SRC/out/.config" \
            "$GITHUB_WORKSPACE/linux/a04e/pmaports/device/downstream/linux-samsung-a04e/config-samsung-a04e.aarch64"
          make -C "$A04E_SRC" O=out ARCH=arm64 CC="$A04E_CLANG" \
            CROSS_COMPILE="$A04E_CROSS_COMPILE" \
            CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS=-w \
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y olddefconfig

      - name: Compile Linux 4.19.191 for A04e
        run: |
          set -euo pipefail
          export ARCH=arm64
          export ANDROID_MAJOR_VERSION=r
          # The pinned vendor Makefile derives CONNAC, WLAN_CHIP_ID=6765,
          # HIF=axi, WMT and BT_PLATFORM=connac1x from the selected Kconfig.
          export CONFIG_DRV_BUILD_IN=y
          export TARGET_BUILD_VARIANT=user
          export TARGET_PRODUCT=a04e
          make -C "$A04E_SRC" O=out ARCH=arm64 CC="$A04E_CLANG" \
            CROSS_COMPILE="$A04E_CROSS_COMPILE" \
            CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS=-w \
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
            KBUILD_BUILD_VERSION=1-postmarketOS -j2
          # Fail if the in-tree MT6765 combo components were not compiled.
          CONN_OUT="$A04E_SRC/out/drivers/misc/mediatek/connectivity"
          test -d "$CONN_OUT"
          find "$CONN_OUT/wlan/core/gen4m" -name '*.o' -print -quit | grep -q .
          find "$CONN_OUT/common" -name '*.o' -print -quit | grep -q .
          # Bluetooth transport is integrated through the shared WMT/BTIF layer
          # in this 4.19 source; there is no separate bt/mt66xx/wmt object tree.
          test -s "$CONN_OUT/common/common_main/linux/stp_btif.o"
          find "$CONN_OUT/gps" -name '*.o' -print -quit | grep -q .
          find "$CONN_OUT/fmradio" -name '*.o' -print -quit | grep -q .
          grep -Fqx 'CONFIG_BLK_DEV_DM=y' "$A04E_SRC/out/.config"
          grep -Fqx 'CONFIG_DM_LINEAR=y' "$A04E_SRC/out/.config"
          test -s "$A04E_SRC/out/arch/arm64/boot/Image.gz"
          file "$A04E_SRC/out/arch/arm64/boot/Image.gz"
          sha256sum "$A04E_SRC/out/arch/arm64/boot/Image.gz" \
            | tee "$RUNNER_TEMP/a04e-toolchains/KERNEL-SHA256-SUM.txt"
          mkdir -p "$RUNNER_TEMP/a04e-output"
          cp "$A04E_SRC/out/arch/arm64/boot/Image.gz" "$RUNNER_TEMP/a04e-output/"
          cp "$A04E_SRC/out/.config" "$RUNNER_TEMP/a04e-output/kernel.config"
          cp "$RUNNER_TEMP/a04e-toolchains/SHA256SUMS.txt" "$RUNNER_TEMP/a04e-output/"
          cp "$RUNNER_TEMP/a04e-toolchains/SHA512SUMS.txt" "$RUNNER_TEMP/a04e-output/"
          cp "$RUNNER_TEMP/a04e-toolchains/KERNEL-SHA256-SUM.txt" "$RUNNER_TEMP/a04e-output/"
          cat > "$RUNNER_TEMP/a04e-output/connectivity-build-info.txt" <<INFO
          Connectivity source: rsuntk-oss/mtk_connectivity_module
          Connectivity commit: $A04E_CONNECTIVITY_COMMIT
          Platform: MT6765 / CONSYS_6765 / MT6631 / CONNAC
          Wi-Fi: Gen4M built-in, HIF=axi, WLAN_CHIP_ID=6765
          Bluetooth: MediaTek WMT/BTIF transport built-in (BlueZ HCI not yet verified)
          GPS: MediaTek combo GPS driver built-in
          FM: MediaTek FM radio driver built-in
          Required proprietary firmware: not bundled; extract from matching stock SM-A042F vendor firmware
          INFO

      - name: Upload kernel build diagnostics and reusable kernel
        uses: actions/upload-artifact@v4
        with:
          name: a04e-kernel-build-diagnostics
          path: ${{ runner.temp }}/a04e-output/
          if-no-files-found: error
          retention-days: 30
