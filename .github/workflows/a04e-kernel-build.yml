name: A04e downstream kernel build

on:
  push:
    paths:
      - "linux/a04e/**"
      - ".github/workflows/a04e-kernel-build.yml"
      - ".github/workflows/a04e-postmarketos-image.yml"
  pull_request:
    paths:
      - "linux/a04e/**"
      - ".github/workflows/a04e-kernel-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-a04e-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out MT-OS
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio flex libelf-dev \
            libncurses-dev libssl-dev python3 rsync xz-utils zlib1g-dev

      - name: Download pinned kernel source and toolchains
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="7c1b304f2df8df4c85abe6fe84b8238d7521bd58"
          KSU_COMMIT="56c55b692a00d90c0568a57ef5a8ed0daa23bb9a"
          CONNECTIVITY_COMMIT="9c4222a3d884e57cf82dda1668f356559e8c8444"
          mkdir -p "$RUNNER_TEMP/a04e-src" "$RUNNER_TEMP/a04e-toolchains"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/ravindu644/android_kernel_a042f/archive/$COMMIT.tar.gz" \
            -o "$RUNNER_TEMP/a04e-src/kernel.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/rifsxd/KernelSU-Next/archive/$KSU_COMMIT.tar.gz" \
            -o "$RUNNER_TEMP/a04e-src/kernelsu-next.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902.tar.gz" \
            -o "$RUNNER_TEMP/a04e-toolchains/clang-r383902.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz" \
            -o "$RUNNER_TEMP/a04e-toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/AbzRaider/vendor-mediatek-kernel_modules-connectivity_4.19/archive/$CONNECTIVITY_COMMIT.tar.gz" \
            -o "$RUNNER_TEMP/a04e-src/connectivity-4.19.tar.gz"
          (
            cd "$RUNNER_TEMP/a04e-toolchains"
            sha256sum *.tar.* | tee SHA256SUMS.txt
            sha512sum *.tar.* "$RUNNER_TEMP/a04e-src/kernel.tar.gz" "$RUNNER_TEMP/a04e-src/kernelsu-next.tar.gz" | tee SHA512SUMS.txt
          )
          tar -xf "$RUNNER_TEMP/a04e-src/kernel.tar.gz" -C "$RUNNER_TEMP/a04e-src"
          SRC="$RUNNER_TEMP/a04e-src/android_kernel_a042f-$COMMIT"
          CONNECTIVITY="$RUNNER_TEMP/a04e-src/vendor/mediatek/kernel_modules/connectivity"
          mkdir -p "$SRC/KernelSU-Next" "$CONNECTIVITY"
          tar -xzf "$RUNNER_TEMP/a04e-src/kernelsu-next.tar.gz" --strip-components=1 -C "$SRC/KernelSU-Next"
          tar -xzf "$RUNNER_TEMP/a04e-src/connectivity-4.19.tar.gz" --strip-components=1 -C "$CONNECTIVITY"
          test -f "$SRC/drivers/kernelsu/Kconfig"
          test -f "$CONNECTIVITY/common/common_main/platform/mt6765.c"
          test -f "$CONNECTIVITY/wlan/adaptor/Makefile"
          test -f "$CONNECTIVITY/wlan/core/gen4m/Makefile"
          tar -xf "$RUNNER_TEMP/a04e-toolchains/clang-r383902.tar.gz" -C "$RUNNER_TEMP/a04e-toolchains"
          tar -xf "$RUNNER_TEMP/a04e-toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz" -C "$RUNNER_TEMP/a04e-toolchains"
          test -f "$SRC/Makefile"
          CLANG="$(find "$RUNNER_TEMP/a04e-toolchains" -path '*/bin/clang' -print -quit)"
          CROSS_GCC="$(find "$RUNNER_TEMP/a04e-toolchains" -name 'aarch64-none-linux-gnu-gcc' -print -quit)"
          test -x "$CLANG"
          test -x "$CROSS_GCC"
          {
            echo "A04E_SRC=$SRC"
            echo "A04E_CONNECTIVITY_SRC=$CONNECTIVITY"
            echo "A04E_CONNECTIVITY_COMMIT=$CONNECTIVITY_COMMIT"
            echo "A04E_CLANG=$CLANG"
            echo "A04E_CROSS_COMPILE=${CROSS_GCC%gcc}"
          } >> "$GITHUB_ENV"

      - name: Configure the stock-matched kernel
        run: |
          set -euo pipefail
          export ARCH=arm64
          export ANDROID_MAJOR_VERSION=r
          make -C "$A04E_SRC" O=out CC="$A04E_CLANG" \
            CROSS_COMPILE="$A04E_CROSS_COMPILE" \
            CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS=-w \
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y a04e_defconfig
          "$A04E_SRC/scripts/kconfig/merge_config.sh" -m -O "$A04E_SRC/out" \
            "$A04E_SRC/out/.config" \
            "$GITHUB_WORKSPACE/linux/a04e/pmaports/device/downstream/linux-samsung-a04e/config-samsung-a04e.aarch64"
          make -C "$A04E_SRC" O=out ARCH=arm64 CC="$A04E_CLANG" \
            CROSS_COMPILE="$A04E_CROSS_COMPILE" \
            CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS=-w \
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y olddefconfig

      - name: Compile Linux 4.19.191 for A04e
        run: |
          set -euo pipefail
          export ARCH=arm64
          export ANDROID_MAJOR_VERSION=r
          # The A04e uses MediaTek CONSYS_6765 / Gen4M connectivity. The
          # downstream Makefile consumes this build variable (not Kconfig)
          # to link the matching vendor WLAN/WMT sources into the kernel.
          export CONFIG_WLAN_DRV_BUILD_IN=y
          export CONFIG_MTK_COMBO_WIFI_HIF=axi
          export MTK_COMBO_CHIP=CONNAC
          export WLAN_CHIP_ID=6765
          export MTK_ANDROID_WMT=y
          # Kbuild's original Makefile constructs these paths from relative
          # srctree/src values. In an O=out build that resolves the symlink
          # targets incorrectly, so anchor the vendor-source links explicitly.
          python3 - "$A04E_SRC/drivers/misc/mediatek/connectivity/Makefile" <<'PY'
          import os
          import sys
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          replacements = {
              "ABS_PATH_TO_WMT_DRV      = $(srctree)/../$(PATH_TO_WMT_DRV)":
                  "ABS_PATH_TO_WMT_DRV      = $(A04E_CONNECTIVITY_SRC)/common",
              "ABS_PATH_TO_WLAN_CHR_DRV = $(srctree)/../$(PATH_TO_WLAN_CHR_DRV)":
                  "ABS_PATH_TO_WLAN_CHR_DRV = $(A04E_CONNECTIVITY_SRC)/wlan/adaptor",
              "ABS_PATH_TO_WLAN_DRV     = $(srctree)/../$(PATH_TO_WLAN_DRV)":
                  "ABS_PATH_TO_WLAN_DRV     = $(A04E_CONNECTIVITY_SRC)/wlan/core/gen4m",
              "$(shell unlink $(srctree)/$(src)/wmt_drv)":
                  "$(shell unlink $(A04E_SRC)/drivers/misc/mediatek/connectivity/wmt_drv)",
              "$(shell unlink $(srctree)/$(src)/wmt_chrdev_wifi)":
                  "$(shell unlink $(A04E_SRC)/drivers/misc/mediatek/connectivity/wmt_chrdev_wifi)",
              "$(shell unlink $(srctree)/$(src)/wlan_drv_gen4m)":
                  "$(shell unlink $(A04E_SRC)/drivers/misc/mediatek/connectivity/wlan_drv_gen4m)",
              "$(shell ln -s $(ABS_PATH_TO_WMT_DRV)      $(srctree)/$(src)/wmt_drv)":
                  "$(shell ln -sfn $(ABS_PATH_TO_WMT_DRV) $(A04E_SRC)/drivers/misc/mediatek/connectivity/wmt_drv)",
              "$(shell ln -s $(ABS_PATH_TO_WLAN_CHR_DRV) $(srctree)/$(src)/wmt_chrdev_wifi)":
                  "$(shell ln -sfn $(ABS_PATH_TO_WLAN_CHR_DRV) $(A04E_SRC)/drivers/misc/mediatek/connectivity/wmt_chrdev_wifi)",
              "$(shell ln -s $(ABS_PATH_TO_WLAN_DRV)     $(srctree)/$(src)/wlan_drv_gen4m)":
                  "$(shell ln -sfn $(ABS_PATH_TO_WLAN_DRV) $(A04E_SRC)/drivers/misc/mediatek/connectivity/wlan_drv_gen4m)",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit("Expected connectivity Makefile path not found: " + old)
              text = text.replace(old, new)
          open(path, "w", encoding="utf-8").write(text)
          PY
          make -C "$A04E_SRC" O=out ARCH=arm64 CC="$A04E_CLANG" \
            CROSS_COMPILE="$A04E_CROSS_COMPILE" \
            CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS=-w \
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
            KBUILD_BUILD_VERSION=1-postmarketOS -j2
          # Fail if the built-in Gen4M source tree was not actually compiled.
          test -d "$A04E_SRC/out/drivers/misc/mediatek/connectivity"
          find "$A04E_SRC/out/drivers/misc/mediatek/connectivity" -path '*/wlan_drv_gen4m/*.o' -print -quit | grep -q .
          find "$A04E_SRC/out/drivers/misc/mediatek/connectivity" -path '*/wmt_chrdev_wifi/*.o' -print -quit | grep -q .
          # Build the MediaTek HCI-over-UART transport as a loadable module.
          # It is packaged for controlled testing, but is not auto-loaded until
          # the handset's BTIF/TTY node and matching firmware are verified.
          make -C "$A04E_SRC" O=out M="$A04E_CONNECTIVITY_SRC/bt/mt66xx" \
            ARCH=arm64 CC="$A04E_CLANG" CROSS_COMPILE="$A04E_CROSS_COMPILE" \
            MTK_CHIP_IF=uart CONFIG_SUPPORT_BLUEZ=y BT_PLATFORM=6765 modules
          test -s "$A04E_CONNECTIVITY_SRC/bt/mt66xx/btmtk_uart_unify.ko"
          test -s "$A04E_SRC/out/arch/arm64/boot/Image.gz"
          file "$A04E_SRC/out/arch/arm64/boot/Image.gz"
          sha256sum "$A04E_SRC/out/arch/arm64/boot/Image.gz" \
            | tee "$RUNNER_TEMP/a04e-toolchains/KERNEL-SHA256-SUM.txt"
          mkdir -p "$RUNNER_TEMP/a04e-output"
          cp "$A04E_SRC/out/arch/arm64/boot/Image.gz" "$RUNNER_TEMP/a04e-output/"
          cp "$A04E_SRC/out/.config" "$RUNNER_TEMP/a04e-output/kernel.config"
          cp "$A04E_CONNECTIVITY_SRC/bt/mt66xx/btmtk_uart_unify.ko" "$RUNNER_TEMP/a04e-output/"
          (cd "$RUNNER_TEMP/a04e-output" && sha256sum btmtk_uart_unify.ko > BT-MODULE-SHA256-SUM.txt)
          cp "$RUNNER_TEMP/a04e-toolchains/SHA256SUMS.txt" "$RUNNER_TEMP/a04e-output/"
          cp "$RUNNER_TEMP/a04e-toolchains/SHA512SUMS.txt" "$RUNNER_TEMP/a04e-output/"
          cp "$RUNNER_TEMP/a04e-toolchains/KERNEL-SHA256-SUM.txt" "$RUNNER_TEMP/a04e-output/"
          cat > "$RUNNER_TEMP/a04e-output/connectivity-build-info.txt" <<INFO
          Connectivity source: AbzRaider/vendor-mediatek-kernel_modules-connectivity_4.19
          Connectivity commit: $A04E_CONNECTIVITY_COMMIT
          MT6765 Gen4M Wi-Fi: built-in via CONFIG_WLAN_DRV_BUILD_IN=y, HIF=axi, WLAN_CHIP_ID=6765
          WMT common source: included from the pinned 4.19 connectivity source tree
          Required proprietary firmware: not bundled; extract from matching stock SM-A042F vendor firmware
          Bluetooth HCI: built as btmtk_uart_unify.ko (experimental); TTY binding and matching firmware still require on-device validation
          INFO

      - name: Upload kernel build diagnostics and reusable kernel
        uses: actions/upload-artifact@v4
        with:
          name: a04e-kernel-build-diagnostics
          path: ${{ runner.temp }}/a04e-output/
          if-no-files-found: error
          retention-days: 30
