name: A04e postmarketOS image build

on:
  push:
    paths:
      - "linux/a04e/**"
      - ".github/workflows/a04e-postmarketos-image.yml"
      - ".github/workflows/a04e-kernel-build.yml"
  pull_request:
    paths:
      - "linux/a04e/**"
      - ".github/workflows/a04e-postmarketos-image.yml"
  workflow_dispatch:

concurrency:
  group: a04e-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build-a04e-postmarketos:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Check out MT-OS
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip python3-venv \
            python3-yaml python3-requests python3-pexpect expect \
            build-essential clang ca-certificates curl e2fsprogs jq rsync \
            android-sdk-libsparse-utils xz-utils zip unzip

      # Wait for the kernel workflow triggered by this exact source commit.
      # This prevents packaging an older kernel artifact after a device/config change.
      - name: Wait for matching A04e kernel build
        id: kernel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/406710969/runs"
          RUN_ID=""
          for attempt in $(seq 1 240); do
            response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API?branch=$GITHUB_REF_NAME&head_sha=$GITHUB_SHA&per_page=20")"
            matching="$(jq -c --arg sha "$GITHUB_SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha)] | first // empty' <<< "$response")"
            if [ -n "$matching" ]; then
              status="$(jq -r '.status' <<< "$matching")"
              conclusion="$(jq -r '.conclusion // empty' <<< "$matching")"
              RUN_ID="$(jq -r '.id' <<< "$matching")"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "Matching kernel workflow $RUN_ID ended with: $conclusion" >&2
                  exit 1
                fi
                break
              fi
            fi
            echo "Waiting for A04e kernel workflow for $GITHUB_SHA (attempt $attempt/240)"
            sleep 30
          done
          test -n "$RUN_ID" || { echo "Timed out waiting for matching kernel build" >&2; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      # Reuse the exact successful kernel built for this commit; do not compile
      # Image.gz again in the postmarketOS packaging job.
      - name: Download matching A04e kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: a04e-kernel-build-diagnostics
          run-id: ${{ steps.kernel.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/a04e-prebuilt-kernel

      - name: Verify and stage the prebuilt kernel
        shell: bash
        run: |
          set -euo pipefail
          KERNEL="$RUNNER_TEMP/a04e-prebuilt-kernel/Image.gz"
          CHECKSUM="$RUNNER_TEMP/a04e-prebuilt-kernel/KERNEL-SHA256-SUM.txt"
          test -s "$KERNEL"
          test -s "$CHECKSUM"
          expected="$(awk 'NR == 1 {print $1}' "$CHECKSUM")"
          actual="$(sha256sum "$KERNEL" | awk '{print $1}')"
          test "$expected" = "$actual" || {
            echo "Kernel artifact checksum mismatch: expected $expected, got $actual" >&2
            exit 1
          }
          test -s "$RUNNER_TEMP/a04e-prebuilt-kernel/kernel.config"
          grep -Fqx 'CONFIG_DEVTMPFS=y' "$RUNNER_TEMP/a04e-prebuilt-kernel/kernel.config"
          grep -Fqx 'CONFIG_BLK_DEV_DM=y' "$RUNNER_TEMP/a04e-prebuilt-kernel/kernel.config"
          grep -Fqx 'CONFIG_DM_LINEAR=y' "$RUNNER_TEMP/a04e-prebuilt-kernel/kernel.config"
          grep -Fqx 'CONFIG_POWER_SUPPLY=y' "$RUNNER_TEMP/a04e-prebuilt-kernel/kernel.config"
          grep -Fqx 'CONFIG_MTK_CHARGER=y' "$RUNNER_TEMP/a04e-prebuilt-kernel/kernel.config"
          grep -Fqx 'CONFIG_MTK_COMBO_WIFI=y' "$RUNNER_TEMP/a04e-prebuilt-kernel/kernel.config"
          grep -Fqx 'CONFIG_MTK_COMBO_BT=y' "$RUNNER_TEMP/a04e-prebuilt-kernel/kernel.config"
          grep -Fqx 'CONFIG_MTK_COMBO_GPS=y' "$RUNNER_TEMP/a04e-prebuilt-kernel/kernel.config"
          grep -Fqx 'CONFIG_MTK_GPS_SUPPORT=y' "$RUNNER_TEMP/a04e-prebuilt-kernel/kernel.config"
          grep -Fqx 'CONFIG_MTK_FMRADIO=y' "$RUNNER_TEMP/a04e-prebuilt-kernel/kernel.config"
          grep -Fqx 'CONFIG_MTK_BTIF=y' "$RUNNER_TEMP/a04e-prebuilt-kernel/kernel.config"
          grep -Fqx 'CONFIG_DRV_BUILD_IN=y' "$RUNNER_TEMP/a04e-prebuilt-kernel/kernel.config"
          test -s "$RUNNER_TEMP/a04e-prebuilt-kernel/connectivity-build-info.txt"
          grep -Fq 'MT6765 / CONSYS_6765 / MT6631 / CONNAC' "$RUNNER_TEMP/a04e-prebuilt-kernel/connectivity-build-info.txt"
          grep -Fq 'Gen4M built-in' "$RUNNER_TEMP/a04e-prebuilt-kernel/connectivity-build-info.txt"
          grep -Fq 'WMT/BTIF transport built-in' "$RUNNER_TEMP/a04e-prebuilt-kernel/connectivity-build-info.txt"
          grep -Fq 'GPS:' "$RUNNER_TEMP/a04e-prebuilt-kernel/connectivity-build-info.txt"
          grep -Fq 'FM:' "$RUNNER_TEMP/a04e-prebuilt-kernel/connectivity-build-info.txt"
          install -Dm644 "$KERNEL" \
            "$GITHUB_WORKSPACE/linux/a04e/pmaports/device/downstream/linux-samsung-a04e/Image.gz"

      - name: Prepare pmbootstrap and pmaports overlay
        shell: bash
        run: |
          set -euo pipefail
          PMB="$RUNNER_TEMP/pmbootstrap"
          PMAPORTS="$RUNNER_TEMP/pmaports"
          WORK="$RUNNER_TEMP/pmbootstrap-work"
          mkdir -p "$HOME/.local/bin"
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git "$PMB"
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git "$PMAPORTS"
          mkdir -p "$PMAPORTS/device/downstream"
          cp -a "$GITHUB_WORKSPACE/linux/a04e/pmaports/device/downstream/." "$PMAPORTS/device/downstream/"
          ln -sf "$PMB/pmbootstrap.py" "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          {
            echo "A04E_PMB=$PMB"
            echo "A04E_PMAPORTS=$PMAPORTS"
            echo "A04E_PMWORK=$WORK"
          } >> "$GITHUB_ENV"
          test -f "$PMAPORTS/device/downstream/device-samsung-a04e/APKBUILD"
          test -f "$PMAPORTS/device/downstream/linux-samsung-a04e/APKBUILD"
          test -s "$PMAPORTS/device/downstream/linux-samsung-a04e/Image.gz"

      - name: Configure pmbootstrap without interactive init
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$HOME/.config/pmbootstrap/config"
          mkdir -p "$(dirname "$CONFIG")" "$A04E_PMWORK/cache_git_v8" "$A04E_PMWORK/cache_pkgs" "$A04E_PMWORK/chroots"
          echo "8" > "$A04E_PMWORK/version"
          echo "8" > "$A04E_PMWORK/.version"
          cat > "$CONFIG" <<CFG
          [pmbootstrap]
          version = 3
          aports = $A04E_PMAPORTS
          work = $A04E_PMWORK
          work_version = 8
          config_channels_version = 4
          device = samsung-a04e
          kernel = downstream
          user = pmos
          ui = phosh
          extra_packages = modemmanager modemmanager-openrc networkmanager networkmanager-openrc iio-sensor-proxy iio-sensor-proxy-openrc
          keymap = us
          locale = en_US.UTF-8
          timezone = UTC
          is_default_channel = True
          jobs = 2
          service_manager = openrc
          CFG
          echo "A04E_PMB_CONFIG=$CONFIG" >> "$GITHUB_ENV"
          pmbootstrap -c "$CONFIG" work_migrate
          pmbootstrap -c "$CONFIG" status

      - name: Build A04e device packages with the prebuilt kernel
        shell: bash
        run: |
          set -euo pipefail
          pmbootstrap -c "$A04E_PMB_CONFIG" --jobs 2 build device-samsung-a04e

      - name: Build experimental Phosh postmarketOS rootfs and boot image
        shell: bash
        run: |
          set -euo pipefail
          pmbootstrap -c "$A04E_PMB_CONFIG" --jobs 2 --assume-yes install \
            --password pmos --no-firewall --no-recommends
          pmbootstrap -c "$A04E_PMB_CONFIG" --jobs 2 initfs build

      - name: Build pinned Android logical-partition tools
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$RUNNER_TEMP/android-lptools"
          git clone https://github.com/itsNileshHere/android-lptools.git "$TOOLS"
          git -C "$TOOLS" checkout b7b5c09916ab88074692006db7dab34256da6e24
          (
            cd "$TOOLS"
            bash ./make.sh
          )
          for tool in lpmake lpdump lpunpack; do
            test -x "$TOOLS/bin/$tool"
          done
          "$TOOLS/bin/lpmake" --help >/dev/null
          "$TOOLS/bin/lpdump" --help >/dev/null 2>&1 || true
          echo "A04E_LPTOOLS=$TOOLS/bin" >> "$GITHUB_ENV"

      - name: Export and validate build outputs
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/a04e-image-output"
          EXPORTED="$RUNNER_TEMP/a04e-pmbootstrap-export"
          mkdir -p "$OUT" "$EXPORTED"

          # pmbootstrap export creates convenience symlinks in the export
          # directory. The old workflow searched the entire pmbootstrap work
          # tree with find -L, which traversed chroots/caches and could run for
          # hours. Only inspect the small, dedicated export directory.
          timeout --signal=TERM --kill-after=30s 10m \
            pmbootstrap -c "$A04E_PMB_CONFIG" export --no-install "$EXPORTED"

          BOOT_SOURCE=""
          for candidate in "$EXPORTED/boot.img" "$EXPORTED/samsung-a04e-boot.img"; do
            if [ -s "$candidate" ]; then BOOT_SOURCE="$candidate"; break; fi
          done
          ROOT_SOURCE=""
          for candidate in "$EXPORTED/samsung-a04e-root.img" "$EXPORTED/root.img"; do
            if [ -s "$candidate" ]; then ROOT_SOURCE="$candidate"; break; fi
          done
          if [ -z "$BOOT_SOURCE" ] || [ -z "$ROOT_SOURCE" ]; then
            echo "Expected pmbootstrap boot.img and samsung-a04e-root.img exports were not found."
            echo "Export directory:"
            find "$EXPORTED" -maxdepth 1 -printf '%y %p -> %l\\n'
            exit 1
          fi
          cp -L -- "$BOOT_SOURCE" "$OUT/boot.img"
          cp -L -- "$ROOT_SOURCE" "$OUT/pmos_root.ext4.img"

          # Normalize Android sparse rootfs input to a raw ext4 image if needed.
          magic="$(od -An -tx1 -N4 "$OUT/pmos_root.ext4.img" | tr -d ' \\n')"
          if [ "$magic" = "3aff26ed" ]; then
            simg2img "$OUT/pmos_root.ext4.img" "$OUT/pmos_root.raw.img"
            mv "$OUT/pmos_root.raw.img" "$OUT/pmos_root.ext4.img"
          fi
          file "$OUT/pmos_root.ext4.img"
          e2fsck -fn "$OUT/pmos_root.ext4.img"

          # Verify Android boot header v2, the actual page size, and the root
          # device passed to the initramfs. The stock BOOT partition is 32 MiB.
          python3 - "$OUT/boot.img" <<'PY'
          import os, struct, sys
          path=sys.argv[1]
          data=open(path,"rb").read()
          if data[:8] != b"ANDROID!":
              raise SystemExit("boot.img is not an Android boot image")
          kernel, ramdisk = struct.unpack_from("<II", data, 8)[0], struct.unpack_from("<I", data, 16)[0]
          page, version = struct.unpack_from("<II", data, 36)
          if version != 2: raise SystemExit(f"Expected Android boot header v2, got {version}")
          if page != 2048: raise SystemExit(f"Expected 2048-byte page size, got {page}")
          if not kernel or not ramdisk: raise SystemExit("Kernel or initramfs payload is empty")
          cmdline=(data[64:576].split(b"\0",1)[0]+data[608:1632].split(b"\0",1)[0]).decode("ascii","ignore")
          if "root=/dev/mapper/pmos_root" not in cmdline:
              raise SystemExit("boot.img command line does not select /dev/mapper/pmos_root")
          if os.path.getsize(path) > 32*1024*1024:
              raise SystemExit("boot.img exceeds the observed 32 MiB BOOT partition")
          print(f"Android boot header v{version}; page={page}; kernel={kernel}; ramdisk={ramdisk}; size={len(data)}")
          print("Kernel command line:",cmdline)
          PY

          # Build a fresh Android dynamic-partition super image containing only
          # pmos_root. This intentionally replaces the Android logical partitions
          # in super; it does not touch userdata or the physical GPT.
          SUPER_SIZE=6786383872
          ROOT_SIZE="$(stat -c %s "$OUT/pmos_root.ext4.img")"
          ALIGN=1048576
          PARTITION_SIZE=$(( (ROOT_SIZE + ALIGN - 1) / ALIGN * ALIGN ))
          GROUP_SIZE=$(( SUPER_SIZE - ALIGN ))
          if [ "$PARTITION_SIZE" -ge "$GROUP_SIZE" ]; then
            echo "postmarketOS root image ($ROOT_SIZE bytes) does not fit safely in A04e super ($SUPER_SIZE bytes)." >&2
            exit 1
          fi
          "$A04E_LPTOOLS/lpmake" \\
            --metadata-size 65536 \\
            --metadata-slots 2 \\
            --super-name super \\
            --device "super:$SUPER_SIZE" \\
            --alignment "$ALIGN" \\
            --alignment-offset 0 \\
            --group "main:$GROUP_SIZE" \\
            --partition "pmos_root:none:$PARTITION_SIZE:main" \\
            --image "pmos_root=$OUT/pmos_root.ext4.img" \\
            --output "$OUT/super.img"

          test "$(stat -c %s "$OUT/super.img")" -eq "$SUPER_SIZE"
          "$A04E_LPTOOLS/lpdump" "$OUT/super.img" | tee "$OUT/SUPER-METADATA.txt"
          grep -Fq "pmos_root" "$OUT/SUPER-METADATA.txt"

          # Round-trip the logical partition and run a read-only filesystem check.
          VERIFY="$RUNNER_TEMP/a04e-super-roundtrip"
          mkdir -p "$VERIFY"
          "$A04E_LPTOOLS/lpunpack" "$OUT/super.img" "$VERIFY"
          test -s "$VERIFY/pmos_root.img"
          cmp -n "$ROOT_SIZE" "$OUT/pmos_root.ext4.img" "$VERIFY/pmos_root.img"
          e2fsck -fn "$VERIFY/pmos_root.img"

          cat > "$OUT/BUILD-INFO.txt" <<INFO
          Target: Samsung Galaxy A04e SM-A042F (A-only)
          Distribution: postmarketOS edge / Phosh (experimental)
          Commit: $GITHUB_SHA
          Kernel: matching A04e Linux 4.19.191 build artifact
          boot.img: Android boot header v2, 2048-byte pages, verified against 32 MiB BOOT partition limit
          super.img: raw Android dynamic-partition image, exact observed size $SUPER_SIZE bytes
          super.img contents: one logical ext4 partition named pmos_root
          Dynamic metadata: 65536-byte metadata, 2 metadata slots, 1 MiB alignment
          Root mapping: /dev/mapper/pmos_root; initramfs make-dynpart-mappings
          Destructive scope: flashing super.img replaces Android system/odm/product/system_ext/vendor logical partitions. It does not contain or overwrite userdata or GPT.
          Validation: lpdump metadata parse, lpunpack round-trip byte comparison, e2fsck read-only check, boot header/cmdline/size checks.
          Hardware status: NOT runtime-tested on the handset. Display compositor, touch input, charging, Wi-Fi, Bluetooth, audio, modem/calls/SMS and suspend still require on-device validation. Do not treat CI structural checks as proof of a working boot.
          Flashing: NOT AUTHORIZED/NOT VALIDATED. Preserve stock boot, super, vbmeta and recovery backups before any test.
          INFO

          rm -f "$OUT/pmos_root.ext4.img"
          find "$OUT" -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 |
            sort -z | xargs -0 -r sha256sum > "$OUT/SHA256SUMS.txt"
          echo "Validated A04e dual-image outputs:"
          find "$OUT" -maxdepth 1 -type f -printf '%f %s bytes\\n' | sort
      - name: Print pmbootstrap log if the build fails
        if: failure()
        shell: bash
        run: |
          set +e
          if [ -f "$A04E_PMWORK/log.txt" ]; then
            tail -n 300 "$A04E_PMWORK/log.txt"
          fi

      - name: Upload A04e postmarketOS bring-up image
        uses: actions/upload-artifact@v4
        with:
          name: a04e-postmarketos-bringup-image
          path: a04e-image-output/
          if-no-files-found: error
          retention-days: 30
