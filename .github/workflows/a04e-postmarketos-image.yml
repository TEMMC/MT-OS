name: A04e postmarketOS image build

on:
  push:
    paths:
      - "linux/a04e/**"
      - ".github/workflows/a04e-postmarketos-image.yml"
      - ".github/workflows/a04e-kernel-build.yml"
  pull_request:
    paths:
      - "linux/a04e/**"
      - ".github/workflows/a04e-postmarketos-image.yml"
  workflow_dispatch:

concurrency:
  group: a04e-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build-a04e-postmarketos:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Check out MT-OS
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip python3-venv \
            python3-yaml python3-requests python3-pexpect expect \
            build-essential ca-certificates curl e2fsprogs jq rsync \
            xz-utils zip unzip

      # Wait for the kernel workflow triggered by this exact source commit.
      # This prevents packaging an older kernel artifact after a device/config change.
      - name: Wait for matching A04e kernel build
        id: kernel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/406710969/runs"
          RUN_ID=""
          for attempt in $(seq 1 240); do
            response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API?branch=$GITHUB_REF_NAME&head_sha=$GITHUB_SHA&per_page=20")"
            matching="$(jq -c --arg sha "$GITHUB_SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha)] | first // empty' <<< "$response")"
            if [ -n "$matching" ]; then
              status="$(jq -r '.status' <<< "$matching")"
              conclusion="$(jq -r '.conclusion // empty' <<< "$matching")"
              RUN_ID="$(jq -r '.id' <<< "$matching")"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "Matching kernel workflow $RUN_ID ended with: $conclusion" >&2
                  exit 1
                fi
                break
              fi
            fi
            echo "Waiting for A04e kernel workflow for $GITHUB_SHA (attempt $attempt/240)"
            sleep 30
          done
          test -n "$RUN_ID" || { echo "Timed out waiting for matching kernel build" >&2; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      # Reuse the exact successful kernel built for this commit; do not compile
      # Image.gz again in the postmarketOS packaging job.
      - name: Download matching A04e kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: a04e-kernel-build-diagnostics
          run-id: ${{ steps.kernel.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/a04e-prebuilt-kernel

      - name: Verify and stage the prebuilt kernel
        shell: bash
        run: |
          set -euo pipefail
          KERNEL="$RUNNER_TEMP/a04e-prebuilt-kernel/Image.gz"
          CHECKSUM="$RUNNER_TEMP/a04e-prebuilt-kernel/KERNEL-SHA256-SUM.txt"
          test -s "$KERNEL"
          test -s "$CHECKSUM"
          expected="$(awk 'NR == 1 {print $1}' "$CHECKSUM")"
          actual="$(sha256sum "$KERNEL" | awk '{print $1}')"
          test "$expected" = "$actual" || {
            echo "Kernel artifact checksum mismatch: expected $expected, got $actual" >&2
            exit 1
          }
          test -s "$RUNNER_TEMP/a04e-prebuilt-kernel/kernel.config"
          grep -Fqx 'CONFIG_DEVTMPFS=y' "$RUNNER_TEMP/a04e-prebuilt-kernel/kernel.config"
          grep -Fqx 'CONFIG_BLK_DEV_DM=y' "$RUNNER_TEMP/a04e-prebuilt-kernel/kernel.config"
          grep -Fqx 'CONFIG_DM_LINEAR=y' "$RUNNER_TEMP/a04e-prebuilt-kernel/kernel.config"
          grep -Fqx 'CONFIG_POWER_SUPPLY=y' "$RUNNER_TEMP/a04e-prebuilt-kernel/kernel.config"
          grep -Fqx 'CONFIG_MTK_CHARGER=y' "$RUNNER_TEMP/a04e-prebuilt-kernel/kernel.config"
          grep -Fqx 'CONFIG_MTK_COMBO_WIFI=y' "$RUNNER_TEMP/a04e-prebuilt-kernel/kernel.config"
          grep -Fqx 'CONFIG_MTK_COMBO_BT=y' "$RUNNER_TEMP/a04e-prebuilt-kernel/kernel.config"
          grep -Fqx 'CONFIG_MTK_COMBO_GPS=y' "$RUNNER_TEMP/a04e-prebuilt-kernel/kernel.config"
          grep -Fqx 'CONFIG_MTK_GPS_SUPPORT=y' "$RUNNER_TEMP/a04e-prebuilt-kernel/kernel.config"
          grep -Fqx 'CONFIG_MTK_FMRADIO=y' "$RUNNER_TEMP/a04e-prebuilt-kernel/kernel.config"
          grep -Fqx 'CONFIG_MTK_BTIF=y' "$RUNNER_TEMP/a04e-prebuilt-kernel/kernel.config"
          grep -Fqx 'CONFIG_DRV_BUILD_IN=y' "$RUNNER_TEMP/a04e-prebuilt-kernel/kernel.config"
          test -s "$RUNNER_TEMP/a04e-prebuilt-kernel/connectivity-build-info.txt"
          grep -Fq 'MT6765 / CONSYS_6765 / MT6631 / CONNAC' "$RUNNER_TEMP/a04e-prebuilt-kernel/connectivity-build-info.txt"
          grep -Fq 'Gen4M built-in' "$RUNNER_TEMP/a04e-prebuilt-kernel/connectivity-build-info.txt"
          grep -Fq 'WMT/BTIF transport built-in' "$RUNNER_TEMP/a04e-prebuilt-kernel/connectivity-build-info.txt"
          grep -Fq 'GPS:' "$RUNNER_TEMP/a04e-prebuilt-kernel/connectivity-build-info.txt"
          grep -Fq 'FM:' "$RUNNER_TEMP/a04e-prebuilt-kernel/connectivity-build-info.txt"
          install -Dm644 "$KERNEL" \
            "$GITHUB_WORKSPACE/linux/a04e/pmaports/device/downstream/linux-samsung-a04e/Image.gz"

      - name: Prepare pmbootstrap and pmaports overlay
        shell: bash
        run: |
          set -euo pipefail
          PMB="$RUNNER_TEMP/pmbootstrap"
          PMAPORTS="$RUNNER_TEMP/pmaports"
          WORK="$RUNNER_TEMP/pmbootstrap-work"
          mkdir -p "$HOME/.local/bin"
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git "$PMB"
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git "$PMAPORTS"
          mkdir -p "$PMAPORTS/device/downstream"
          cp -a "$GITHUB_WORKSPACE/linux/a04e/pmaports/device/downstream/." "$PMAPORTS/device/downstream/"
          ln -sf "$PMB/pmbootstrap.py" "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          {
            echo "A04E_PMB=$PMB"
            echo "A04E_PMAPORTS=$PMAPORTS"
            echo "A04E_PMWORK=$WORK"
          } >> "$GITHUB_ENV"
          test -f "$PMAPORTS/device/downstream/device-samsung-a04e/APKBUILD"
          test -f "$PMAPORTS/device/downstream/linux-samsung-a04e/APKBUILD"
          test -s "$PMAPORTS/device/downstream/linux-samsung-a04e/Image.gz"

      - name: Configure pmbootstrap without interactive init
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$HOME/.config/pmbootstrap/config"
          mkdir -p "$(dirname "$CONFIG")" "$A04E_PMWORK/cache_git_v8" "$A04E_PMWORK/cache_pkgs" "$A04E_PMWORK/chroots"
          echo "8" > "$A04E_PMWORK/version"
          echo "8" > "$A04E_PMWORK/.version"
          cat > "$CONFIG" <<CFG
          [pmbootstrap]
          version = 3
          aports = $A04E_PMAPORTS
          work = $A04E_PMWORK
          work_version = 8
          config_channels_version = 4
          device = samsung-a04e
          kernel = downstream
          user = pmos
          ui = phosh
          extra_packages = modemmanager modemmanager-openrc networkmanager networkmanager-openrc iio-sensor-proxy iio-sensor-proxy-openrc
          keymap = us
          locale = en_US.UTF-8
          timezone = UTC
          is_default_channel = True
          jobs = 2
          service_manager = openrc
          CFG
          echo "A04E_PMB_CONFIG=$CONFIG" >> "$GITHUB_ENV"
          pmbootstrap -c "$CONFIG" work_migrate
          pmbootstrap -c "$CONFIG" status

      - name: Build A04e device packages with the prebuilt kernel
        shell: bash
        run: |
          set -euo pipefail
          pmbootstrap -c "$A04E_PMB_CONFIG" --jobs 2 build device-samsung-a04e

      - name: Build experimental Phosh postmarketOS rootfs and boot image
        shell: bash
        run: |
          set -euo pipefail
          pmbootstrap -c "$A04E_PMB_CONFIG" --jobs 2 --assume-yes install \
            --password pmos --no-firewall --no-recommends
          pmbootstrap -c "$A04E_PMB_CONFIG" --jobs 2 initfs build

      - name: Export and validate build outputs
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/a04e-image-output"
          EXPORTED="$RUNNER_TEMP/a04e-pmbootstrap-export"
          mkdir -p "$OUT" "$EXPORTED"

          # pmbootstrap export creates convenience symlinks in the export
          # directory. The old workflow searched the entire pmbootstrap work
          # tree with find -L, which traversed chroots/caches and could run for
          # hours. Only inspect the small, dedicated export directory.
          timeout --signal=TERM --kill-after=30s 10m \
            pmbootstrap -c "$A04E_PMB_CONFIG" export --no-install "$EXPORTED"

          shopt -s nullglob
          exported_files=("$EXPORTED"/*)
          if [ "${#exported_files[@]}" -eq 0 ]; then
            echo "pmbootstrap export produced no entries."
            find "$EXPORTED" -maxdepth 1 -printf '%y %p -> %l\\n'
            exit 1
          fi

          for file in "${exported_files[@]}"; do
            if [ -f "$file" ]; then
              cp -L -- "$file" "$OUT/$(basename "$file")"
            fi
          done

          if ! find "$OUT" -maxdepth 1 -type f -name '*.img' -size +1M -print -quit | grep -q .; then
            echo "No postmarketOS image file larger than 1 MiB was exported."
            echo "pmbootstrap export directory:"
            find "$EXPORTED" -maxdepth 1 -printf '%y %p -> %l\\n'
            echo "Collected output directory:"
            find "$OUT" -maxdepth 1 -printf '%y %p (%s bytes)\\n'
            exit 1
          fi

          cat > "$OUT/BUILD-INFO.txt" <<'INFO'
          Target: Samsung Galaxy A04e SM-A042F
          Distribution: postmarketOS edge
          User interface: Phosh (experimental; Phoc/display backend not hardware-validated)
          Mobile services: ModemManager, NetworkManager, iio-sensor-proxy
          Device package: device-samsung-a04e
          Kernel: reused Linux 4.19.191 Image.gz from matching successful kernel workflow run ${{ steps.kernel.outputs.run_id }}
          DTBs: rebuilt from the pinned A04e kernel source; not a full kernel rebuild
          Display/touch kernel support: legacy MediaTek mtkfb/LCM and Jadard JD9365T are enabled in the pinned kernel; actual panel variant and Linux userspace presentation remain unverified
          Display: legacy MTK framebuffer/LCM only; no verified DRM/KMS backend. Phosh is packaged but may not start on-device until a working Phoc display backend is ported.
          Flashing: NOT VALIDATED; do not flash this artifact. Use only for offline inspection and controlled diagnostic boot planning
          Default diagnostic login: pmos / pmos; change it immediately if booted
          DTBO: the handset's original DTBO partition has not been replaced
          INFO
          for boot in "$OUT"/boot*.img; do
            [ -f "$boot" ] || continue
            boot_size="$(stat -c %s "$boot")"
            if [ "$boot_size" -gt 33554432 ]; then
              echo "ERROR: $(basename "$boot") is ${boot_size} bytes; handset boot partition is only 33554432 bytes." >&2
              exit 1
            fi
          done

          # Generate checksums only for actual deliverables, not the checksum
          # file itself.
          find "$OUT" -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 |
            sort -z | xargs -0 -r sha256sum > "$OUT/SHA256SUMS.txt"
          echo "Validated export files:"
          find "$OUT" -maxdepth 1 -type f -printf '%f %s bytes\\n' | sort

      - name: Print pmbootstrap log if the build fails
        if: failure()
        shell: bash
        run: |
          set +e
          if [ -f "$A04E_PMWORK/log.txt" ]; then
            tail -n 300 "$A04E_PMWORK/log.txt"
          fi

      - name: Upload A04e postmarketOS bring-up image
        uses: actions/upload-artifact@v4
        with:
          name: a04e-postmarketos-bringup-image
          path: a04e-image-output/
          if-no-files-found: error
          retention-days: 30
