name: A04e Linux port preflight

on:
  push:
    paths:
      - "linux/a04e/**"
      - ".github/workflows/a04e-linux-port-preflight.yml"
  pull_request:
    paths:
      - "linux/a04e/**"
      - ".github/workflows/a04e-linux-port-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-port-workbench:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate device and toolchain manifests
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          device = json.loads(Path("linux/a04e/device.json").read_text())
          expected = {
              "codename": "a04e",
              "supported_model": "SM-A042F",
              "architecture": "aarch64",
              "soc": "MediaTek MT6765",
              "status": "bring-up-research",
              "flashable": False,
              "verified_linux_boot": False,
          }
          for key, value in expected.items():
              if device.get(key) != value:
                  raise SystemExit(f"{key}: expected {value!r}, got {device.get(key)!r}")

          pins = json.loads(Path("linux/a04e/kernel-sources.json").read_text())
          tools = json.loads(Path("linux/a04e/pmaports/toolchains.json").read_text())
          kernel_apkbuild = Path("linux/a04e/pmaports/device/downstream/linux-samsung-a04e/APKBUILD").read_text()
          commit = "7c1b304f2df8df4c85abe6fe84b8238d7521bd58"
          assert pins["downstream"]["commit"] == commit
          assert pins["downstream"]["kernel_version"] == "4.19.191"
          assert pins["downstream"]["defconfig"] == "a04e_defconfig"
          assert tools["kernel_source"]["commit"] == commit
          assert tools["compiler"]["name"] == "clang-r383902"
          assert tools["cross_toolchain"]["name"] == "arm-gnu-toolchain-14.2.rel1"
          assert "3781c2b7d2a62372c56334dacfba191b78e2632baa61430454ede4410cdf183e5acd26ebb7d8c01b158e5845a2b72a9728f07472c9e2b88637432a1df00a1f48  Image.gz" in kernel_apkbuild
          print("A04e hardware and source pins are internally consistent.")
          PY

      - name: Validate package safety and source pins
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          deviceinfo = Path("linux/a04e/pmaports/device/downstream/device-samsung-a04e/deviceinfo").read_text()
          kernel = Path("linux/a04e/pmaports/device/downstream/linux-samsung-a04e/APKBUILD").read_text()
          device = Path("linux/a04e/pmaports/device/downstream/device-samsung-a04e/APKBUILD").read_text()
          fragment = Path("linux/a04e/pmaports/device/downstream/linux-samsung-a04e/config-samsung-a04e.aarch64").read_text()
          toolchain = json.loads(Path("linux/a04e/pmaports/toolchains.json").read_text())
          checks = {
              "Heimdall Android boot-image packaging configured": 'deviceinfo_flash_method="heimdall-bootimg"' in deviceinfo,
              "Heimdall targets only the BOOT partition": 'deviceinfo_flash_heimdall_partition_kernel="BOOT"' in deviceinfo,
              "Android boot header v2 configured": 'deviceinfo_header_version="2"' in deviceinfo,
              "Android boot page size configured": 'deviceinfo_flash_pagesize="2048"' in deviceinfo,
              "flashability is not falsely claimed": '"flashable": false' in Path("linux/a04e/device.json").read_text(),
              "DRM not falsely advertised": 'deviceinfo_drm="false"' in deviceinfo,
              "kernel source commit pinned": "7c1b304f2df8df4c85abe6fe84b8238d7521bd58" in kernel,
              "Clang pin recorded in toolchain manifest": toolchain["compiler"]["name"] == "clang-r383902",
              "device package depends on kernel": "linux-samsung-a04e" in device,
              "devtmpfs enabled for initramfs": "CONFIG_DEVTMPFS=y" in fragment,
              "DRM/KMS remains explicitly unclaimed": 'deviceinfo_drm="false"' in deviceinfo,
          }
          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL") + ": " + name)
          if not all(checks.values()):
              raise SystemExit(1)
          PY

      - name: Check diagnostic script syntax
        run: |
          bash -n linux/a04e/scripts/collect-a04e.sh
          bash -n linux/a04e/scripts/collect-panel-touch.sh
          bash -n linux/a04e/scripts/fetch-a04e-kernel-artifact.sh

      - name: Check JSON and whitespace
        run: |
          python3 -m json.tool linux/a04e/device.json >/dev/null
          python3 -m json.tool linux/a04e/kernel-sources.json >/dev/null
          python3 -m json.tool linux/a04e/pmaports/toolchains.json >/dev/null
          git diff --check
