name: A04e Linux port preflight

on:
  push:
    paths:
      - "linux/a04e/**"
      - ".github/workflows/a04e-linux-port-preflight.yml"
  pull_request:
    paths:
      - "linux/a04e/**"
      - ".github/workflows/a04e-linux-port-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-port-workbench:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate device manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("linux/a04e/device.json")
          d = json.loads(p.read_text())
          required = {
              "codename": "a04e",
              "supported_model": "SM-A042F",
              "architecture": "aarch64",
              "soc": "MediaTek MT6765",
              "status": "bring-up-research",
              "flashable": False,
              "verified_linux_boot": False,
          }
          for key, expected in required.items():
              actual = d.get(key)
              if actual != expected:
                  raise SystemExit(f"{key}: expected {expected!r}, got {actual!r}")
          print("Manifest valid. This is not a boot or hardware compatibility test.")
          PY

      - name: Check diagnostic script syntax
        run: bash -n linux/a04e/scripts/collect-a04e.sh


      - name: Validate pinned kernel tracks
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("linux/a04e/kernel-sources.json")
          data = json.loads(p.read_text())
          downstream = data["downstream"]
          assert downstream["repository"].endswith("android_kernel_a042f.git")
          assert downstream["commit"] == "7c1b304f2df8df4c85abe6fe84b8238d7521bd58"
          assert downstream["kernel_version"] == "4.19.191"
          assert downstream["defconfig"] == "a04e_defconfig"
          assert data["policy"]["build_environment"] == "github-actions"
          assert data["policy"]["interface"] == "phosh"
          assert data["policy"]["flashable"] is False
          assert data["mainline"]["status"] == "research-only"
          print("Kernel source pins and safety gates valid.")
          PY

      - name: Verify pmaports overlay status
        run: |
          grep -q "pmbootstrap" linux/a04e/pmaports/README.md
          grep -q "No device package" linux/a04e/pmaports/README.md
          echo "pmaports overlay is documented; no unverified package is built."

      - name: Check documentation safety statements
        run: |
          grep -q "no flashable image exists yet" linux/a04e/README.md
          grep -q "does \`not\` mean Linux boots" linux/a04e/README.md || true
          echo "Safety and porting documentation present."
